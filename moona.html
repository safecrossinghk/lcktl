<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中秋限定 · 線上賞月與天氣預報</title>

<!-- 引入 html2canvas 用於一鍵生成分享海報 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
background-color: #070d19;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 20px 15px;
}

h1 {
font-size: 1.6rem;
margin-bottom: 20px;
color: #f39c12;
text-align: center;
letter-spacing: 2px;
}

/* 賞月海報卡片容器 */
.card-container {
background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 100%);
border: 1px solid rgba(243, 156, 18, 0.3);
border-radius: 20px;
padding: 25px 20px;
width: 100%;
max-width: 360px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
text-align: center;
position: relative;
}

/* Canvas 夜空與月亮畫布 */
#moonCanvas {
width: 220px;
height: 220px;
margin: 10px auto;
display: block;
border-radius: 50%;
}

.score-title {
font-size: 0.9rem;
color: #a0aec0;
margin-top: 10px;
}

.score-value {
font-size: 3rem;
font-weight: bold;
color: #f4d03f;
line-height: 1.1;
margin-bottom: 5px;
}

.score-value span {
font-size: 1.2rem;
}

.status-text {
background: rgba(255, 255, 255, 0.08);
border-radius: 12px;
padding: 10px 15px;
font-size: 0.9rem;
margin: 15px 0;
line-height: 1.4;
color: #e2e8f0;
}

.details-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
font-size: 0.85rem;
color: #cbd5e0;
text-align: left;
background: rgba(0, 0, 0, 0.2);
padding: 12px;
border-radius: 10px;
}

.details-grid div {
display: flex;
justify-content: space-between;
}

/* 操作按鈕群組 */
.btn-group {
margin-top: 20px;
display: flex;
flex-direction: column;
gap: 10px;
width: 100%;
max-width: 360px;
}

button {
background: #f39c12;
color: #070d19;
border: none;
padding: 12px;
border-radius: 10px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
transition: all 0.2s ease;
}

button:hover {
background: #f1c40f;
transform: translateY(-2px);
}

button.secondary {
background: rgba(255, 255, 255, 0.1);
color: #fff;
border: 1px solid rgba(255, 255, 255, 0.2);
}

button.secondary:hover {
background: rgba(255, 255, 255, 0.2);
}

.footer-brand {
margin-top: 15px;
font-size: 0.75rem;
color: #718096;
}
</style>
</head>
<body>

<h1>🌕 中秋限定 · 線上賞月預報</h1>

<!-- 被截圖導出的卡片區域 -->
<div class="card-container" id="shareCard">
<div id="locationText" style="font-size: 0.85rem; color: #cbd5e0;">📍 正在獲取天文台氣象數據...</div>

<!-- Canvas 動態繪製區域 -->
<canvas id="moonCanvas" width="220" height="220"></canvas>

<div class="score-title">今晚賞月指數</div>
<div class="score-value" id="scoreNum">-- <span>分</span></div>

<div class="status-text" id="statusText">資料分析中...</div>

<div class="details-grid">
<div><span>預測天氣：</span><strong id="weatherDesc">--</strong></div>
<div><span>平均氣溫：</span><strong id="tempText">--</strong></div>
<div><span>相對濕度：</span><strong id="humidityText">--</strong></div>
<div><span>天文台數據：</span><strong>即時連線</strong></div>
</div>

<div class="footer-brand">— 中秋限定 · 雲端賞月觀測站 —</div>
</div>

<!-- 功能按鈕區 -->
<div class="btn-group">
<button onclick="downloadPoster()">📸 生成並下載賞月海報</button>
<button class="secondary" onclick="loadHKOData()">🔄 重新整理氣象資料</button>
</div>

<script>
// 1. 繪製 Canvas (動態渲染月亮與雲層)
function drawMoonScene(cloudLevel = 30) {
const canvas = document.getElementById('moonCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;
const centerX = width / 2;
const centerY = height / 2;
const moonRadius = 45;

ctx.clearRect(0, 0, width, height);

// (1) 月光外圍金色光暈
const glow = ctx.createRadialGradient(centerX, centerY, moonRadius, centerX, centerY, moonRadius + 55);
glow.addColorStop(0, 'rgba(244, 208, 63, 0.8)');
glow.addColorStop(0.4, 'rgba(244, 208, 63, 0.2)');
glow.addColorStop(1, 'rgba(244, 208, 63, 0)');

ctx.fillStyle = glow;
ctx.beginPath();
ctx.arc(centerX, centerY, moonRadius + 55, 0, Math.PI * 2);
ctx.fill();

// (2) 月亮主體
ctx.fillStyle = '#fffdf0';
ctx.beginPath();
ctx.arc(centerX, centerY, moonRadius, 0, Math.PI * 2);
ctx.fill();

// (3) 動態遮擋雲層 (依據 cloudLevel 調整透明度與擴展範圍)
if (cloudLevel > 0) {
const cloudOpacity = Math.min(0.85, 0.2 + (cloudLevel / 100) * 0.65);
ctx.fillStyle = `rgba(160, 175, 195, ${cloudOpacity})`;

const scale = 0.8 + (cloudLevel / 100) * 0.5;
const cloudCircles = [
{ x: centerX - 30, y: centerY + 15, r: 35 },
{ x: centerX + 10, y: centerY + 10, r: 40 },
{ x: centerX + 40, y: centerY + 25, r: 30 },
{ x: centerX - 10, y: centerY - 5, r: 30 }
];

cloudCircles.forEach(c => {
ctx.beginPath();
ctx.arc(c.x, c.y, c.r * scale, 0, Math.PI * 2);
ctx.fill();
});
}
}

// 2. 呼叫香港天文台 (HKO) 開放數據 API
async function loadHKOData() {
document.getElementById('statusText').innerText = "連線至香港天文台數據庫...";

try {
// API 1: 取得地區即時氣溫與濕度
const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
const rhrData = await rhrRes.json();

// API 2: 取得預報與天氣描述
const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
const fndData = await fndRes.json();

const todayForecast = fndData.weatherForecast[0];
const forecastText = todayForecast.forecastWeather;

// 抓取氣溫與濕度
const temp = rhrData.temperature?.data[0]?.value || todayForecast.forecastMintemp.value;
const humidity = rhrData.humidity?.data[0]?.value || todayForecast.forecastMinrh.value;

// 計算賞月指數與估算雲量 %
let score = 85;
let estimatedCloud = 30;
let advice = "";

if (forecastText.includes("天晴") || forecastText.includes("陽光")) {
score = 98;
estimatedCloud = 10;
advice = "🌕 皓月當空！天氣極佳，非常適合肉眼賞月與拍攝夜景。";
} else if (forecastText.includes("大致天晴")) {
score = 88;
estimatedCloud = 25;
advice = "🌙 月色清晰！僅有微量薄雲，不影響觀賞美好月容。";
} else if (forecastText.includes("多雲") || forecastText.includes("短暫時間")) {
score = 65;
estimatedCloud = 60;
advice = "⛅ 彩雲追月！月亮時隱時現，需要稍微耐心等待雲層散開。";
} else if (forecastText.includes("密雲") || forecastText.includes("驟雨") || forecastText.includes("雷暴")) {
score = 30;
estimatedCloud = 90;
advice = "🌧️ 夜空雲層較厚，建議透過線上賞月模式一起許願！";
} else {
advice = "🌕 祝您中秋佳節快樂，團團圓圓！";
}

// 更新 UI 文字
document.getElementById('locationText').innerText = `📍 香港地區預報 · ${todayForecast.week}`;
document.getElementById('scoreNum').innerHTML = `${score} <span>分</span>`;
document.getElementById('statusText').innerText = advice;
document.getElementById('weatherDesc').innerText = forecastText.slice(0, 6);
document.getElementById('tempText').innerText = `${temp}°C`;
document.getElementById('humidityText').innerText = `${humidity}%`;

// 重新繪製 Canvas
drawMoonScene(estimatedCloud);

} catch (err) {
console.error(err);
document.getElementById('statusText').innerText = "暫時無法獲取氣象數據，以預設賞月模式展示。";
drawMoonScene(30);
}
}

// 3. 一鍵生成並下載海報 (html2canvas)
async function downloadPoster() {
const card = document.getElementById('shareCard');

const canvas = await html2canvas(card, {
scale: 2, // 2倍解析度（高清）
backgroundColor: '#0d1b2a',
useCORS: true
});

const image = canvas.toDataURL("image/png");
const a = document.createElement('a');
a.href = image;
a.download = `中秋賞月預報_${new Date().getTime()}.png`;
a.click();
}

// 初始化載入
window.onload = () => {
drawMoonScene(30);
loadHKOData();
};
</script>
</body>
</html>
