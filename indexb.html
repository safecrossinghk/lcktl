<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fa">
<title>LSK001 紅綠燈倒數</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  background: #f5f7fa;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 520px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 28px;
}

.road-name {
  margin: 0 0 24px;
  text-align: center;
  color: #666;
  font-size: 15px;
}

.countdown-card {
  background: white;
  border-radius: 20px;
  padding: 28px 20px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
}

.state {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 10px;
}

.seconds {
  font-size: 86px;
  line-height: 1;
  font-weight: 700;
  margin: 10px 0;
}

.unit {
  font-size: 20px;
  color: #666;
}

.status {
  min-height: 24px;
  margin-top: 18px;
  color: #666;
  font-size: 14px;
}

.button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}

.button:disabled {
  opacity: 0.5;
}

.info-card {
  margin-top: 16px;
  background: white;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
}

.info-title {
  font-weight: 700;
  margin-bottom: 12px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.info-row:last-child {
  border-bottom: 0;
}

.info-label {
  color: #666;
}

.info-value {
  text-align: right;
  font-weight: 600;
}

.error {
  color: #c62828;
}
</style>
</head>

<body>

<main class="container">
  <h1>LSK001 紅綠燈倒數</h1>
  <p class="road-name">荔枝角道東行／長荔街行人過路處</p>

  <section class="countdown-card">
    <div class="state" id="state">正在取得資料…</div>
    <div class="seconds" id="seconds">--</div>
    <div class="unit">秒</div>
    <div class="status" id="status">正在連接 LSK001 Worker…</div>
    <button class="button" id="refreshButton" type="button">🔄 重新校正</button>
  </section>

  <section class="info-card">
    <div class="info-title">Worker 倒數資料</div>
    <div class="info-row">
      <span class="info-label">GREEN</span>
      <span class="info-value" id="greenAverage">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">RED</span>
      <span class="info-value" id="redAverage">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">Cycle</span>
      <span class="info-value" id="cycleAverage">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">模型</span>
      <span class="info-value" id="modelSource">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">API 計算時間</span>
      <span class="info-value" id="apiTime">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">最新 GREEN 距今</span>
      <span class="info-value" id="greenAge">--</span>
    </div>
  </section>
</main>

<script>
const WORKER_API = 'https://lsk001-api.ctakwah.workers.dev';

const stateElement = document.getElementById('state');
const secondsElement = document.getElementById('seconds');
const statusElement = document.getElementById('status');
const refreshButton = document.getElementById('refreshButton');

const greenAverageElement = document.getElementById('greenAverage');
const redAverageElement = document.getElementById('redAverage');
const cycleAverageElement = document.getElementById('cycleAverage');
const modelSourceElement = document.getElementById('modelSource');
const apiTimeElement = document.getElementById('apiTime');
const greenAgeElement = document.getElementById('greenAge');

let countdownTimer = null;
let countdownEndAtMs = null;
let currentState = null;
let modelData = null;

// =================================================
// 1. 取得 Worker 倒數資料（加入防快取）
// =================================================
async function loadCountdown() {
  refreshButton.disabled = true;
  statusElement.textContent = '正在向 Worker 取得最新資料…';
  statusElement.classList.remove('error');

  try {
    // 加上時間戳參數與 Header 防快取，防止 Safari/Chrome 讀取舊 API 快取
    const cacheBuster = `_t=${Date.now()}`;
    const response = await fetch(
      `${WORKER_API}/api/signal-countdown?road_id=LSK001&${cacheBuster}`,
      {
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache'
        }
      }
    );

    const data = await response.json();
    console.log('LSK001 Countdown API：', data);

    if (!response.ok || !data.ok || !data.countdown_available || !data.available) {
      throw new Error('目前沒有可用的倒數資料');
    }

    const remaining = Number(data.estimated_remaining_sec);
    if (!Number.isFinite(remaining)) {
      throw new Error('Worker 沒有提供有效的剩餘時間');
    }

    // 更新狀態與模型資料
    currentState = data.current_state;
    modelData = {
      green_average_sec: Number(data.model?.green_average_sec) || 31.9,
      red_average_sec: Number(data.model?.red_average_sec) || 91.9
    };

    // 設定目標時間戳並觸發顯示
    countdownEndAtMs = Date.now() + remaining * 1000;
    updateDisplay(remaining, currentState);
    startLocalCountdown();

    // 更新面板數據
    greenAverageElement.textContent = `${Number(data.model.green_average_sec).toFixed(1)} 秒`;
    redAverageElement.textContent = `${Number(data.model.red_average_sec).toFixed(1)} 秒`;
    cycleAverageElement.textContent = `${Number(data.model.cycle_average_sec).toFixed(1)} 秒`;
    modelSourceElement.textContent = data.model_source || '--';
    apiTimeElement.textContent = data.current_hong_kong_time || '--';
    greenAgeElement.textContent = Number.isFinite(Number(data.latest_green_age_sec))
      ? `${Number(data.latest_green_age_sec).toFixed(1)} 秒`
      : '--';

    statusElement.textContent = '✅ 已與 Worker 同步';
  } catch (error) {
    console.error('取得 LSK001 倒數失敗：', error);
    stopLocalCountdown();
    stateElement.textContent = '⚠️ 無法取得倒數';
    secondsElement.textContent = '--';
    statusElement.textContent = `取得資料失敗：${error.message}`;
    statusElement.classList.add('error');
  } finally {
    refreshButton.disabled = false;
  }
}

// =================================================
// 2. 更新畫面 (改用 Math.floor 確保 0 秒精準顯示)
// =================================================
function updateDisplay(remaining, state) {
  stateElement.textContent = state === 'GREEN' ? '🟢 綠燈' : '🔴 紅燈';
  // Math.floor 確保 0.9s -> 0，倒數至最後 0 秒才會進行轉燈
  secondsElement.textContent = Math.max(0, Math.floor(remaining));
}

// =================================================
// 3. 開始本地倒數 (解決 0 秒卡死，實現自動跨燈號切換)
// =================================================
function startLocalCountdown() {
  if (countdownTimer !== null) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  countdownTimer = setInterval(() => {
    if (!Number.isFinite(countdownEndAtMs)) return;

    const remaining = (countdownEndAtMs - Date.now()) / 1000;

    // -------------------------------------------------
    // 當倒數到達 0 秒（或微幅跨過 0）
    // -------------------------------------------------
    if (remaining <= 0) {
      console.log('本地倒數結束，自動切換燈號並向 Worker 校正…');

      // 1. 本地先行自動切換燈號，避免畫面卡在 0 秒
      const nextState = currentState === 'GREEN' ? 'RED' : 'GREEN';
      const nextDuration = nextState === 'GREEN'
        ? modelData.green_average_sec
        : modelData.red_average_sec;

      currentState = nextState;
      countdownEndAtMs = Date.now() + nextDuration * 1000;
      updateDisplay(nextDuration, currentState);

      // 2. 背景靜默重新向 Worker 同步最新資料
      loadCountdown();
      return;
    }

    updateDisplay(remaining, currentState);
  }, 250); // 每 250ms 刷新一次，保證流暢與對時精確
}

// =================================================
// 4. 停止本地倒數
// =================================================
function stopLocalCountdown() {
  if (countdownTimer !== null) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

// =================================================
// 5. 事件監聽：手動校正 & 前背景自動對時
// =================================================
refreshButton.addEventListener('click', () => {
  loadCountdown();
});

// 手機切換 App 或進入背景後，返回前景無條件重新校正
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopLocalCountdown();
  } else {
    console.log('網頁返回前景，無條件重新校正…');
    loadCountdown();
  }
});

// =================================================
// 初始化
// =================================================
loadCountdown();
</script>

</body>
</html>
